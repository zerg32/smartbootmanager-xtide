name: Build boot components

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential nasm perl
      - name: Build and validate
        run: make ci-boot-components boot-region debug-binaries
      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-components
          path: |
            build/sbm-loader.bin
            build/sbm-main.bin
            build/xtide-386.bin
            build/boot-region.bin
            build/debug-mbr.bin
            build/debug-mbr-chs.bin
            build/debug-stage2.bin
            build/debug-stage2-chs.bin
